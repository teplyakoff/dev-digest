# pnpm settings for this standalone package. Not a workspace — pnpm 11 reads
# these settings only from this file, no longer from the `pnpm` field of
# package.json.
#
# pnpm 11 flipped `strictDepBuilds` to true, so an install now FAILS on any
# dependency whose build script has not been explicitly decided on. Both below
# ship a prebuilt platform binary through optionalDependencies (esbuild via
# vitest; sharp via Next.js image optimization), so their build scripts were
# never run under pnpm 10 either. `false` keeps that exact behaviour.
allowBuilds:
  esbuild: false
  sharp: false
